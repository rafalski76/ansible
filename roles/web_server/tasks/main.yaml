---
- name: Update apt cache
  ansible.builtin.apt:
    update_cache: true
    cache_valid_time: 3600
  tags:
    - update

- name: Install MySQL package
  ansible.builtin.apt:
    name: "{{ mysql_package_name }}"
    state: latest
  tags:
    - bootstrap

- name: Configure nginx
  ansible.builtin.import_tasks: nginx.yaml
# - ansible.builtin.import_tasks: db.yaml
