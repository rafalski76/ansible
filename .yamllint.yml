---
extends: default
ignore: |
  projekt/secret.yaml
  roles/geerlingguy.*
  projekt/roles/geerlingguy.*
rules:
  line-length: disable
  document-start: disable
  truthy:
    check-keys: false
  # wymagane przez ansible-lint
  comments:
    min-spaces-from-content: 1
  comments-indentation: false
  braces:
    max-spaces-inside: 1
  octal-values:
    forbid-implicit-octal: true
    forbid-explicit-octal: true
